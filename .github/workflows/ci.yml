name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: pnx_training_test
          POSTGRES_USER: pnx_test
          POSTGRES_PASSWORD: pnx_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pnx_test -d pnx_training_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_NAME: pnx_training_test
      DATABASE_USER: pnx_test
      DATABASE_PASSWORD: pnx_test_password
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.12.13
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install --require-hashes --requirement requirements-dev.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests
      - run: pytest
      - run: pip-audit --requirement requirements.lock --disable-pip
      - name: 验证迁移前滚与回滚
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v6
      - name: 扫描常见明文秘密格式
        shell: bash
        run: |
          if git grep -IEn -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}'; then
            echo "检测到疑似明文秘密"
            exit 1
          fi
      - name: 准备开发环境变量
        run: cp .env.example .env
      - name: 校验 Compose 配置
        run: docker compose --env-file .env --file infra/compose/compose.yml config --quiet
      - name: 构建并启动完整拓扑
        run: docker compose --env-file .env --file infra/compose/compose.yml up --build --detach
      - name: 验证统一入口与健康状态
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/health/worker >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose --env-file .env --file infra/compose/compose.yml ps
              docker compose --env-file .env --file infra/compose/compose.yml logs --no-color
              exit 1
            fi
            sleep 5
          done
          curl --fail --silent http://127.0.0.1:8080/login >/dev/null
          curl --fail --silent http://127.0.0.1:8080/health/live >/dev/null
          curl --fail --silent http://127.0.0.1:8080/health/ready >/dev/null
          curl --fail --silent http://127.0.0.1:8080/health/worker >/dev/null
      - name: 输出服务状态
        if: always()
        run: docker compose --env-file .env --file infra/compose/compose.yml ps
      - name: 清理 Compose
        if: always()
        run: docker compose --env-file .env --file infra/compose/compose.yml down --volumes --remove-orphans
